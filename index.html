<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b1f">
<title>صندوق تواد</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تواد">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f6f2;--card:#fff;--ink:#14201a;--mut:#5d6a61;--line:#e1e5df;--g:#2f6b1f;--g2:#e8f2df;--y:#fff4c2;--bad:#b3261e;--ok:#1d7a3a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:980px;margin:auto;padding:14px 16px 60px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:50%;background:#fff}
h1{font-size:24px;margin:0;line-height:1.1}h2{font-size:20px;margin:0 0 10px}h3{font-size:17px;margin:14px 0 6px}
.mut{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}.tabs a{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
.tabs a.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi b{display:block;font-size:22px;white-space:nowrap}
.kpi.key{background:var(--g);color:#fff;border-color:var(--g)}.kpi.key .mut{color:#d8ecd0}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.pri{background:var(--g);border-color:var(--g);color:#fff}button.warn{color:var(--bad);border-color:#efc9c6}
button:disabled{opacity:.5;cursor:progress}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #7fb35a;outline-offset:2px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;min-height:44px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:14.5px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}th{color:var(--mut);font-weight:500;font-size:13px}
.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--g2);color:var(--g);white-space:nowrap}
.chip.wait{background:var(--y);color:#6b5200}.chip.bad{background:#fbe4e2;color:var(--bad)}
.big{font-size:44px;font-weight:700;line-height:1;color:var(--g)}
.steps{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}.steps li{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:15px}.steps li.done{background:var(--g2);color:var(--g)}.steps li.now{background:var(--y)}
.rules{background:var(--bg);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}.rules ol,.rules ul{margin:6px 0;padding-inline-start:22px}
.login{max-width:380px;margin:8vh auto;text-align:center}.login img{width:110px;height:110px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.err{color:var(--bad);font-size:14px;min-height:1.3em}
.hide{display:none!important}
.dlg{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg .card{max-width:460px;width:100%;max-height:90vh;overflow:auto;margin:0}
.toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:30;text-align:center}
.highlight{border-color:#e6c44d;box-shadow:0 0 0 3px #fff4c2}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}.stack thead{display:none}.stack tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}.stack td{border:0;padding:2px 0;display:flow-root;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:13px}}
.bankf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.bankf button{flex-direction:column;align-items:flex-start;gap:0;line-height:1.3;padding:6px 14px}.bankf small{font-size:12px;color:var(--mut)}.bankf button.on{background:var(--g);border-color:var(--g);color:#fff}.bankf button.on small{color:#d8ecd0}
tr.grp th{background:var(--g2);color:var(--g);font-weight:700;font-size:14px;padding:7px 10px}
.ent td input{display:inline-block;min-height:40px;margin:0;max-width:120px;text-align:end}
.ent tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
@media(max-width:600px){.ent td input{max-width:none}}
/* الاتفاقية */
#agree{position:fixed;inset:0;background:#555;overflow:auto;z-index:25;padding:12px}
#agree .bar{max-width:794px;margin:0 auto 10px;display:flex;gap:8px}
.page{width:794px;height:1123px;background:#fff;color:#000;padding:30px;margin:0;font:14px/1.6 Arial,"Noto Naskh Arabic",sans-serif;transform-origin:top right}
.pgw{margin:0 auto;overflow:hidden}
.frame{height:100%;border:3px double #000;outline:1px solid #000;outline-offset:3px;padding:20px 32px 14px;display:flex;flex-direction:column}
.frame .logo{display:block;margin:2px auto 0;height:54px}
.ttl{text-align:center;font:700 22px "Noto Naskh Arabic",serif;text-decoration:underline;text-underline-offset:7px;margin:6px 0}
.page p{margin:0 0 3px;text-align:justify}.page h4{font-size:14.5px;margin:5px 0 1px}.page ul{margin:0 0 4px;padding-inline-start:22px}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.sched{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.3}.sched th,.sched td{border:1px solid #000;padding:1.5px 5px;text-align:center;color:#000;font-size:inherit}.sched th{background:#f0f0f0;font-weight:700}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:auto;padding-top:8px}.signs .dots{border-bottom:2px dotted #000;height:22px}.signs .s{position:relative;height:70px}.signs .s img{position:absolute;top:-16px;right:60px;max-height:100px;max-width:200px}
@media print{body{background:#fff;padding:0}body>*:not(#agree){display:none!important}#agree{position:static;background:#fff;padding:0;overflow:visible}#agree .bar{display:none}.page{transform:none!important;margin:0}.pgw{width:auto!important;height:auto!important;overflow:visible}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <section class="login" id="loginV">
    <img src="/icon-192.png" alt="">
    <h1 style="margin:14px 0 4px">صندوق تواد</h1>
    <p class="mut" id="lHint">ادخل برقم الهوية ورقم الجوال المسجل في الصندوق</p>
    <form id="otpF" class="card" style="text-align:start">
      <label>رقم الهوية<input id="oNid" inputmode="numeric" autocomplete="username" maxlength="10" required></label>
      <label id="oPhoneL">رقم الجوال<input id="oPhone" inputmode="tel" placeholder="05xxxxxxxx" maxlength="14" required></label>
      <label id="oCodeL" class="hide">رمز التحقق المرسل على الواتساب<input id="oCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
      <p class="err" id="oErr"></p>
      <button class="pri" style="width:100%" id="oBtn">إرسال رمز التحقق عبر واتساب</button>
      <button type="button" id="oBack" class="hide" style="width:100%;margin-top:8px">تغيير البيانات أو إعادة الإرسال</button>
    </form>
    <form id="loginF" class="card hide" style="text-align:start">
      <label>رقم الهوية<input id="lNid" inputmode="numeric" maxlength="10" required></label>
      <label>الرمز السري<input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <p class="err" id="lErr"></p>
      <button class="pri" style="width:100%">دخول</button>
    </form>
    <p><a href="#" id="swLogin" class="mut">دخول برمز سري (للإدارة)</a></p>
    <p class="mut">نسخة تجريبية · للاستفسار تواصل مع إدارة الصندوق</p>
  </section>

  <section id="mainV" class="hide">
    <div class="top">
      <div class="brand"><img src="/icon-192.png" alt=""><div><h1>صندوق تواد</h1><div class="mut" id="who"></div></div></div>
      <button id="logout">خروج</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </section>
</div>
<div id="agree" class="hide"></div>
<div id="dlgHost"></div>

const BANKS = {ahli:'الأهلي', riyad:'بنك الرياض', fransi:'الفرنسي', other:'بنك آخر'};
const BANK_ORDER = Object.keys(BANKS);
const SUB = 250;
const digits = v => String(v || '').replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[^\d]/g, '');
function myBanks(){ return me?.admin_banks || []; }
function bankOwners(ms){ const o = {}; ms.filter(m => m.is_admin && m.admin_banks).forEach(m => m.admin_banks.forEach(b => o[b] = (o[b] ? o[b] + ' و' : '') + String(m.full_name).split(' ')[0])); return o; }
function bankFilter(){ let f = 'mine'; try{ f = localStorage.getItem('tawad-bankF') || 'mine'; }catch(e){} if(f === 'mine' && !myBanks().length) f = 'all'; return f; }
function setBankFilter(v){ try{ localStorage.setItem('tawad-bankF', v); }catch(e){} }
function bankMatch(m, f){ return f === 'all' ? true : f === 'mine' ? myBanks().includes(m.bank) : f === 'none' ? !m.bank : m.bank === f; }
function bankSort(a, b){ const i = x => x.bank ? BANK_ORDER.indexOf(x.bank) : 99; return i(a) - i(b) || (a.member_no ?? 1e9) - (b.member_no ?? 1e9); }
function bankTitle(b, owners){ return b ? `حساب ${BANKS[b] || b}${owners[b] ? ' — ' + esc(owners[b]) : ''}` : 'بدون بنك محدد'; }
function bankChips(ms, f, owners, done){
  const opts = [];
  if(myBanks().length) opts.push(['mine', 'حساباتي', myBanks().map(b => BANKS[b]).join(' + ')]);
  BANK_ORDER.forEach(b => { if(ms.some(m => m.bank === b)) opts.push([b, BANKS[b], owners[b] || '']); });
  if(ms.some(m => !m.bank)) opts.push(['none', 'بدون بنك', 'حدّد بنكه']);
  opts.push(['all', 'الكل', 'كل البنوك']);
  return `<div class="bankf" role="group" aria-label="فرز حسب البنك">` + opts.map(([k, l, sub]) => { const list = ms.filter(m => bankMatch(m, k));
    return `<button type="button" data-bf="${k}" class="${f === k ? 'on' : ''}" aria-pressed="${f === k}"><span>${l}</span><small>${esc(sub)} · ${done ? list.filter(done).length + '/' : ''}${list.length}${done ? ' مسجل' : ' عضو'}</small></button>`; }).join('') + `</div>`;
}
const ymd = d => d ? new Date(d).toLocaleDateString('en-GB') : '';
const monthTxt = d => { if(!d) return ''; const x = new Date(d); return MONTHS[x.getMonth()] + ' ' + x.getFullYear(); };

function toast(t){ const d = document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 3500); }
function errMsg(e){ return (e && (e.message || e.error_description)) || 'حدث خطأ'; }
async function run(btn, fn){ if(btn) btn.disabled = true; try{ await fn(); } catch(e){ toast(errMsg(e)); } finally { if(btn) btn.disabled = false; } }
function dialog(title, bodyHtml, onOk, okText='تأكيد'){
  $('dlgHost').innerHTML = `<div class="dlg"><form class="card" id="dlgF"><h2>${title}</h2>${bodyHtml}<div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" id="dlgNo">إلغاء</button><button class="pri" id="dlgOk">${okText}</button></div></form></div>`;
  $('dlgNo').onclick = () => $('dlgHost').innerHTML = '';
  $('dlgF').onsubmit = e => { e.preventDefault(); run($('dlgOk'), async () => { await onOk(new FormData($('dlgF'))); $('dlgHost').innerHTML=''; }); };
}
function schedule(l){
  const rows = []; if(!l.total || !l.installment || !l.first_due) return rows;
  const n = Math.ceil(l.total / l.installment), f = new Date(l.first_due);
  for(let k=0;k<n;k++){ const d = new Date(f.getFullYear(), f.getMonth()+k, 1); rows.push({k:k+1, y:d.getFullYear(), m:MONTHS[d.getMonth()], v: k===n-1 ? l.total - l.installment*(n-1) : l.installment}); }
  return rows;
}
async function signed(path){ if(!path) return null; const {data} = await sb.storage.from('loan-docs').createSignedUrl(path, 600); return data?.signedUrl || null; }
async function upload(file, path){
  if(!file) throw new Error('اختر الملف');
  if(file.size > 10*1024*1024) throw new Error('حجم الملف أكبر من 10 ميجا');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const full = `${path}-${Date.now()}.${ext}`;
  const {error} = await sb.storage.from('loan-docs').upload(full, file, {contentType: file.type || undefined});
  if(error) throw error; return full;
}

const OTP_MSG = {not_found:'البيانات غير مطابقة لأي عضو مسجل، تواصل مع إدارة الصندوق', too_many:'محاولات كثيرة، حاول بعد 15 دقيقة', whatsapp_failed:'تعذّر إرسال رسالة الواتساب، حاول لاحقاً', bad_code:'الرمز غير صحيح', expired:'انتهت صلاحية الرمز، اطلب رمزاً جديداً', locked:'تم قفل الرمز بعد محاولات خاطئة، اطلب رمزاً جديداً', bad_id:'رقم الهوية 10 أرقام', server:'خطأ في الخادم، حاول لاحقاً'};
let otpStage = 'send';
async function otpCall(body){
  const r = await fetch(SB_URL + '/functions/v1/otp', {method:'POST', headers:{'Content-Type':'application/json', apikey: SB_KEY}, body: JSON.stringify(body)});
  let d = {}; try { d = await r.json(); } catch(e) {}
  if(!r.ok) throw new Error((OTP_MSG[d.error] || 'تعذّر الاتصال') + (d.error==='bad_code' && d.left >= 0 ? ` — باقي ${d.left} محاولات` : ''));
  return d;
}
function otpStageSet(st){
  otpStage = st;
  $('oCodeL').classList.toggle('hide', st==='send'); $('oBack').classList.toggle('hide', st==='send');
  $('oPhoneL').classList.toggle('hide', st!=='send'); $('oNid').readOnly = st!=='send';
  $('oBtn').textContent = st==='send' ? 'إرسال رمز التحقق عبر واتساب' : 'دخول';
  if(st==='verify') setTimeout(()=>$('oCode').focus(), 50);
}
$('otpF').onsubmit = async e => {
  e.preventDefault(); $('oErr').textContent = ''; const btn = $('oBtn'); btn.disabled = true;
  const nid = $('oNid').value.trim();
  try{
    if(!/^\d{10}$/.test(nid)) throw new Error(OTP_MSG.bad_id);
    if(otpStage==='send'){
      const d = await otpCall({action:'send', nid, phone: $('oPhone').value});
      $('lHint').innerHTML = `أرسلنا رمز التحقق على الواتساب للرقم <bdi dir="ltr">${esc(d.masked)}</bdi>`; otpStageSet('verify');
    } else {
      const d = await otpCall({action:'verify', nid, code: $('oCode').value});
      const {error} = await sb.auth.verifyOtp({token_hash: d.token_hash, type:'magiclink'}); if(error) throw error;
    }
  } catch(err){ $('oErr').textContent = errMsg(err); }
  btn.disabled = false;
};
$('oBack').onclick = () => { otpStageSet('send'); $('oCode').value=''; $('oErr').textContent=''; $('lHint').textContent='ادخل برقم الهوية ورقم الجوال المسجل في الصندوق'; };
$('swLogin').onclick = e => { e.preventDefault(); const pin = $('loginF').classList.toggle('hide') === false; $('otpF').classList.toggle('hide', pin); $('swLogin').textContent = pin ? 'الدخول بالواتساب' : 'دخول برمز سري (للإدارة)'; };

sb.auth.onAuthStateChange((ev, session) => { if(['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev)) setTimeout(() => boot(session), 0); });

async function boot(session){
  if(!session){ me = null; $('loginV').classList.remove('hide'); $('mainV').classList.add('hide'); return; }
  const {data} = await sb.from('members').select('*').eq('user_id', session.user.id).maybeSingle();
  if(!data){ $('lErr').textContent = $('oErr').textContent = 'حسابك غير مرتبط بعضو نشط، تواصل مع الإدارة'; await sb.auth.signOut(); return; }
  me = data;
  const {data: ad} = await sb.rpc('admin_names'); admins = {}; (ad||[]).forEach(a => admins[a.id] = a);
  $('who').textContent = me.full_name + (me.is_admin ? ' · أدمن' : '');
  $('loginV').classList.add('hide'); $('mainV').classList.remove('hide');
  render();
}

async function viewMe(){
  const [{data: tx}, {data: loans}, {data: q}] = await Promise.all([
    sb.from('transactions').select('*').eq('member_id', me.id).order('period', {ascending:false}),
    sb.from('loans').select('*').eq('member_id', me.id).order('created_at', {ascending:false}),
    sb.rpc('my_queue')
  ]);
  const subs = (tx||[]).filter(t => t.kind==='subscription').reduce((s,t) => s + +t.amount, 0);
  const paidOf = id => (tx||[]).filter(t => t.kind==='installment' && t.loan_id===id).reduce((s,t)=>s + +t.amount, 0);
  const active = (loans||[]).find(l => l.status==='disbursed');
  const bal = active ? active.total - paidOf(active.id) : 0;
  const open = (loans||[]).find(l => OPEN.includes(l.status));

async function openLoanCard(l, q){

  let h = `<div class="card highlight"><div class="row sp"><h2>طلبي الحالي</h2><span class="chip wait">${ST[l.status]}</span></div>

  if(l.status==='queued' && q) h += `<div class="row" style="gap:24px;margin:8px 0"><div><div class="mut">ترتيبك الحالي</div><div class="big">${q.pos}</div></div><div><div class="mut">عدد الطلبات قبلك</div><div class="big">${q.ahead}</div></div></div><p class="mut">قد يتغير ترتيبك إذا تقدّم عضو أولويته أعلى حسب آلية الترتيب.</p><button class="warn" id="cancelReq">إلغاء الطلب</button>`;
  if(l.status==='approved') h += `<div class="rules">تم اعتماد قرضك بإجمالي <b>${fmt(l.total)}</b> ريال، قسط شهري <b>${fmt(l.installment)}</b> يبدأ ${monthTxt(l.first_due)}.<br>١) نزّل الاتفاقية واطبعها ووقّعها. ٢) أنشئ حوالة مجدولة من بنكك بنفس الجدول. ٣) ارفع الاثنين هنا.</div>
    <button id="showAgree">عرض الاتفاقية للطباعة</button>
    <form id="docsF" style="margin-top:12px"><label>الاتفاقية موقّعة (صورة أو PDF)<input type="file" name="a" accept="image/*,application/pdf" required></label>
    <label>صورة الحوالة المجدولة<input type="file" name="s" accept="image/*,application/pdf" required></label>
    <button class="pri">رفع الوثائق</button></form>`;
  h += `<ul class="steps">${steps.map((s,k) => `<li class="${k<=i?'done':k===i+1?'now':''}">${k<=i?'✓ ':''}${s}</li>`).join('')}</ul>`;
  if(i >= 1) h += `<p style="margin-top:10px"><a href="#loan-${l.id}">تفاصيل القرض والجدول</a></p>`;
  return h + '</div>';
}

const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'],teens=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
const u1000 = n => { const p=[], h=Math.floor(n/100), r=n%100; if(h) p.push(hund[h]); if(r){ if(r<10) p.push(ones[r]); else if(r<20) p.push(teens[r-10]); else p.push((r%10? ones[r%10]+' و':'')+tens[Math.floor(r/10)]); } return p.join(' و'); };
const words = n => { n=Math.floor(n); if(!n) return 'صفر'; const p=[], th=Math.floor(n/1000)%1000, mil=Math.floor(n/1e6), r=n%1000; if(mil) p.push(mil===1?'مليون':u1000(mil)+' مليون'); if(th) p.push(th===1?'ألف':th===2?'ألفان':th<=10?u1000(th)+' آلاف':u1000(th)+' ألف'); if(r) p.push(u1000(r)); return p.join(' و'); };

    async () => { const {error} = await sb.rpc('admin_verify', {p_loan: +b.dataset.verify}); if(error) throw error; toast('وصل إشعار للأدمن الثاني'); render(); }));
  $('view').querySelectorAll('[data-release]').forEach(b => b.onclick = () => dialog('الاعتماد الثاني', '<p>أعتمد هذا القرض للصرف؟</p>',
    async () => { const {error} = await sb.rpc('admin_release', {p_loan: +b.dataset.release}); if(error) throw error; toast('القرض جاهز للصرف'); render(); }));
  $('view').querySelectorAll('[data-disburse]').forEach(b => b.onclick = () => dialog('تسجيل الصرف', '<p class="mut">بعد التحويل من الحساب الأساسي (بنك الرياض) ارفع صورة إشعار الحوالة.</p><label>إشعار الحوالة<input type="file" name="f" accept="image/*,application/pdf" required></label>',
    async d => { const p = await upload(d.get('f'), `${b.dataset.mid}/${b.dataset.disburse}/receipt`); const {error} = await sb.rpc('admin_disburse', {p_loan: +b.dataset.disburse, p_receipt: p}); if(error) throw error; toast('تم تسجيل الصرف'); render(); }));
}

// ---------- الأدمن: الأعضاء ----------
async function viewMembers(){
  const {data: all, error} = await sb.from('members').select('*').order('member_no', {nullsFirst:false});
  if(error) throw error;
  const owners = bankOwners(all); let f = bankFilter();
  const bankSel = (v, attr) => `<select ${attr} style="min-height:36px;margin:0"><option value="">— بدون —</option>${BANK_ORDER.map(b => `<option value="${b}" ${v === b ? 'selected' : ''}>${BANKS[b]}</option>`).join('')}</select>`;
  $('view').innerHTML = `<div class="card"><h2>إضافة عضو</h2><form id="addM"><div class="g2">
    <label>رقم العضوية<input name="no" type="number"></label><label>رقم الهوية<input name="nid" inputmode="numeric" maxlength="10" required></label>
    <label>الاسم<input name="name" required></label><label>الجوال<input name="phone" inputmode="tel"></label>
    <label>تاريخ الانضمام<input name="joined" type="date"></label><label>يودع في بنك${bankSel(f !== 'all' && f !== 'none' && f !== 'mine' ? f : (myBanks()[0] || ''), 'name="bank"')}</label>
    <label>الصلاحية<select name="adm"><option value="0">عضو</option><option value="1">أدمن</option></select></label></div>
    <button class="pri">إضافة</button></form>
    <p class="mut">لتفعيل دخوله: من Supabase ← Authentication ← Add user، البريد <b dir="ltr">رقم_الهوية@tawad.app</b> والرمز السري 6 أرقام، مع تفعيل Auto Confirm.</p></div>
  <div class="card"><h2>الأعضاء (<span id="mCount"></span>)</h2><div id="bf"></div>
  <table class="stack"><thead><tr><th>#</th><th>الاسم</th><th>البنك</th><th>الهوية</th><th>الجوال</th><th>الحالة</th><th>الدخول</th></tr></thead><tbody id="mBody"></tbody></table></div>`;
  function draw(){
    const list = all.filter(m => bankMatch(m, f)).sort(bankSort); let last;
    $('bf').innerHTML = bankChips(all, f, owners); $('mCount').textContent = list.length;
    $('mBody').innerHTML = list.map(m => { const g = m.bank !== last ? (last = m.bank, `<tr class="grp"><th colspan="7">${bankTitle(m.bank, owners)}</th></tr>`) : '';
      return g + `<tr><td>${m.member_no ?? ''}</td><td>${esc(m.full_name)}${m.is_admin ? ' <span class="chip">أدمن</span>' : ''}</td><td>${bankSel(m.bank || '', `data-bank="${m.id}"`)}</td><td>${esc(m.national_id)}</td><td>${esc(m.phone)}</td><td><select data-st="${m.id}" style="min-height:36px;margin:0">${['active','withdrawn','deceased'].map(s => `<option value="${s}" ${m.status===s?'selected':''}>${{active:'نشط',withdrawn:'منسحب',deceased:'متوفى'}[s]}</option>`).join('')}</select></td><td>${m.user_id ? '<span class="chip">مفعّل</span>' : '<span class="chip wait">غير مفعّل</span>'}</td></tr>`; }).join('')
      || '<tr><td colspan="7" class="mut">لا يوجد أعضاء في هذا الحساب.</td></tr>';
    $('mBody').querySelectorAll('[data-st]').forEach(s => s.onchange = () => run(null, async () => { const {error} = await sb.from('members').update({status: s.value}).eq('id', +s.dataset.st); if(error) throw error; all.find(m => m.id === +s.dataset.st).status = s.value; toast('تم التحديث'); }));
    $('mBody').querySelectorAll('[data-bank]').forEach(s => s.onchange = () => run(s, async () => { const v = s.value || null;
      const {error} = await sb.from('members').update({bank: v}).eq('id', +s.dataset.bank); if(error) throw error;
      all.find(m => m.id === +s.dataset.bank).bank = v; toast(v ? 'نُقل إلى حساب ' + BANKS[v] : 'أُزيل البنك'); draw(); }));
  }
  $('bf').onclick = e => { const b = e.target.closest('[data-bf]'); if(!b) return; f = b.dataset.bf; setBankFilter(f); draw(); };
  draw();
  $('addM').onsubmit = e => { e.preventDefault(); const d = new FormData(e.target); run(e.submitter, async () => {
    const {error} = await sb.from('members').insert({member_no: d.get('no') ? +d.get('no') : null, national_id: d.get('nid').trim(), full_name: d.get('name').trim(), phone: d.get('phone') || null, joined_on: d.get('joined') || null, bank: d.get('bank') || null, is_admin: d.get('adm')==='1'});
    if(error) throw error; toast('تمت الإضافة'); render(); }); };
}

// ---------- الأدمن: الحركات (الإدخال الشهري حسب البنك) ----------
let txMonth = null;
async function viewTx(){
  const now = new Date(); txMonth = txMonth || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const period = txMonth + '-01';
  const [{data: all, error}, {data: loans}, {data: monthTx, error: e2}, {data: tx}] = await Promise.all([
    sb.from('members').select('id, full_name, member_no, bank, status, is_admin, admin_banks').order('member_no'),
    sb.from('loans').select('id, member_id, total, installment').eq('status','disbursed'),
    sb.from('transactions').select('member_id, kind, amount').eq('period', period),
    sb.from('transactions').select('*, members!transactions_member_id_fkey(full_name)').order('created_at', {ascending:false}).limit(40)
  ]);
  if(error) throw error; if(e2) throw e2;
  const owners = bankOwners(all), ms = all.filter(m => !m.status || m.status === 'active');
  let f = bankFilter();
  const loanOf = id => (loans||[]).find(l => l.member_id === id);
  const prev = {}; (monthTx||[]).forEach(t => { const p = prev[t.member_id] ||= {}; p[t.kind] = (p[t.kind] || 0) + Number(t.amount); });
  const draft = {}; ms.forEach(m => draft[m.id] = {s:'', i:''});
  const shown = () => ms.filter(m => bankMatch(m, f)).sort(bankSort);
  const has = m => !!(prev[m.id]?.subscription || prev[m.id]?.installment || draft[m.id].s || draft[m.id].i);
  const pending = () => ms.filter(m => draft[m.id].s || draft[m.id].i);
  const prevTxt = m => { const p = prev[m.id]; if(!p) return '<span class="mut">—</span>'; return ['subscription','installment','fee'].filter(k => p[k]).map(k => `${KIND[k]} ${fmt(p[k])}`).join(' · '); };

  $('view').innerHTML = `<div class="card">
    <div class="row sp"><h2 style="margin:0">الإدخال الشهري</h2><label style="margin:0;min-width:170px">الشهر<input type="month" id="txM" value="${txMonth}"></label></div>
    <p class="mut">اكتب المبلغ واضغط Enter أو السهم للأسفل للعضو التالي. الخانة الفاضية ما تنحفظ، واللي انسجل سابقاً لهذا الشهر يظهر في عمود "مسجل".</p>
    <div id="bf"></div>
    <div class="row" style="margin-bottom:8px"><button type="button" id="fillAll">تعبئة المستحق</button><button type="button" id="clearAll">تفريغ</button><button type="button" class="pri" data-save>حفظ</button></div>
    <table class="stack ent" id="entT"><thead><tr><th>العضو</th><th>مسجل هالشهر</th><th class="n">اشتراك</th><th class="n">القسط المستحق</th><th class="n">قسط</th></tr></thead><tbody></tbody><tfoot></tfoot></table>
    <div class="row" style="margin-top:10px"><button type="button" class="pri" data-save>حفظ</button></div></div>
  <div class="card"><h2>حركة مفردة (رسوم أو تعديل)</h2><form id="txF"><div class="g2">
    <label>العضو<select name="m" required>${all.slice().sort(bankSort).map(m => `<option value="${m.id}">${m.member_no ?? ''} — ${esc(m.full_name)}${m.bank ? ' · ' + BANKS[m.bank] : ''}</option>`).join('')}</select></label>
    <label>الشهر<input name="p" type="month" value="${txMonth}" required></label>
    <label>النوع<select name="k">${Object.entries(KIND).filter(k => k[0] !== 'disbursement').map(([k,t]) => `<option value="${k}" ${k==='fee'?'selected':''}>${t}</option>`).join('')}</select></label>
    <label>المبلغ<input name="a" type="number" min="1" value="50" required></label></div>
    <p class="mut">قسط القرض يُربط تلقائياً بقرض العضو القائم.</p><button class="pri">حفظ</button></form></div>
  <div class="card"><h2>آخر الحركات</h2><table class="stack"><thead><tr><th>العضو</th><th>الشهر</th><th>النوع</th><th class="n">المبلغ</th></tr></thead><tbody>${(tx||[]).map(t => `<tr><td>${esc(t.members?.full_name)}</td><td>${monthTxt(t.period)}</td><td>${KIND[t.kind]}</td><td class="n">${fmt(t.amount)}</td></tr>`).join('')}</tbody></table></div>`;

  function chips(){ $('bf').innerHTML = bankChips(ms, f, owners, has); }
  function totals(){
    const list = shown(), sumS = list.reduce((a, m) => a + (+draft[m.id].s || 0), 0), sumI = list.reduce((a, m) => a + (+draft[m.id].i || 0), 0), due = list.reduce((a, m) => a + (loanOf(m.id)?.installment || 0), 0);
    $('entT').tFoot.innerHTML = list.length ? `<tr><td>المجموع · ${list.length} عضو</td><td>${list.filter(has).length}/${list.length} مسجل</td><td class="n">${fmt(sumS)}</td><td class="n">${fmt(due)}</td><td class="n">${fmt(sumI)}</td></tr>` : '';
    const n = pending().length; document.querySelectorAll('[data-save]').forEach(b => b.textContent = n ? `حفظ (${n})` : 'حفظ');
  }
  function draw(){
    let last; chips();
    $('entT').tBodies[0].innerHTML = shown().map(m => { const l = loanOf(m.id), d = draft[m.id];
      const g = m.bank !== last ? (last = m.bank, `<tr class="grp"><th colspan="5">${bankTitle(m.bank, owners)}</th></tr>`) : '';
      return g + `<tr><td>${m.member_no ?? ''} — ${esc(m.full_name)}</td><td>${prevTxt(m)}</td>
        <td class="n"><input data-m="${m.id}" data-k="s" inputmode="numeric" enterkeyhint="next" value="${d.s}" placeholder="0" aria-label="اشتراك ${esc(m.full_name)}"></td>
        <td class="n">${l ? fmt(l.installment) : '—'}</td>
        <td class="n">${l ? `<input data-m="${m.id}" data-k="i" inputmode="numeric" enterkeyhint="next" value="${d.i}" placeholder="0" aria-label="قسط ${esc(m.full_name)}">` : '—'}</td></tr>`; }).join('')
      || '<tr><td colspan="5" class="mut">لا يوجد أعضاء نشطين في هذا الحساب.</td></tr>';
    totals();
  }
  $('bf').onclick = e => { const b = e.target.closest('[data-bf]'); if(!b) return; f = b.dataset.bf; setBankFilter(f); draw(); };
  $('entT').addEventListener('input', e => { const el = e.target; if(!el.dataset.m) return; el.value = digits(el.value); draft[el.dataset.m][el.dataset.k] = el.value; totals(); chips(); });
  $('entT').addEventListener('keydown', e => { const el = e.target; if(!el.dataset.k || !['Enter','ArrowDown','ArrowUp'].includes(e.key)) return; e.preventDefault();
    const ins = [...$('entT').querySelectorAll(`input[data-k="${el.dataset.k}"]`)], nx = ins[ins.indexOf(el) + (e.key === 'ArrowUp' ? -1 : 1)]; if(nx){ nx.focus(); nx.select(); } });
  $('fillAll').onclick = () => { let n = 0; shown().forEach(m => { const p = prev[m.id] || {}, l = loanOf(m.id), d = draft[m.id];
      if(!p.subscription && !d.s){ d.s = String(SUB); n++; } if(l && !p.installment && !d.i){ d.i = String(l.installment); n++; } });
    draw(); toast(n ? 'تمت تعبئة المستحق لغير المسجلين — عدّل الاستثناءات ثم احفظ' : 'كل الأعضاء هنا مسجلين لهذا الشهر'); };
  $('clearAll').onclick = () => { shown().forEach(m => draft[m.id] = {s:'', i:''}); draw(); };
  $('txM').onchange = e => { if(pending().length && !confirm('فيه مبالغ ما انحفظت، تبي تغيّر الشهر وتتركها؟')){ e.target.value = txMonth; return; } txMonth = e.target.value || txMonth; render(); };
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    const rows = [];
    for(const m of pending()){ const d = draft[m.id];
      if(+d.s) rows.push({member_id: m.id, period, kind: 'subscription', amount: +d.s, loan_id: null, created_by: me.id});
      if(+d.i){ const l = loanOf(m.id); if(!l){ toast(`${m.full_name}: ما عليه قرض قائم`); return; } rows.push({member_id: m.id, period, kind: 'installment', amount: +d.i, loan_id: l.id, created_by: me.id}); } }
    if(!rows.length){ toast('ما فيه مبالغ للحفظ'); return; }
    const total = rows.reduce((a, r) => a + r.amount, 0), banks = [...new Set(pending().map(m => m.bank ? BANKS[m.bank] : 'بدون بنك'))].join('، ');
    dialog('حفظ حركات ' + monthTxt(period), `<p>${rows.length} حركة بمجموع <b>${fmt(total)}</b> ريال<br><span class="mut">الحسابات: ${esc(banks)}</span></p>`, async () => {
      const {error} = await sb.from('transactions').insert(rows); if(error) throw error; toast('تم حفظ ' + rows.length + ' حركة'); render(); }, 'حفظ');
  });
  draw();

  $('txF').onsubmit = e => { e.preventDefault(); const d = new FormData(e.target); run(e.submitter, async () => {
    const mid = +d.get('m'), kind = d.get('k'); const loan = loanOf(mid);
    if(kind==='installment' && !loan) throw new Error('هذا العضو ليس عليه قرض قائم');
    const {error} = await sb.from('transactions').insert({member_id: mid, period: d.get('p') + '-01', kind, amount: +d.get('a'), loan_id: kind==='installment' ? loan.id : null, created_by: me.id});
    if(error) throw error; toast('تم الحفظ'); render(); }); };
}

// ---------- الأدمن: الإعدادات ----------
async function viewSettings(){
  const sig = await signed(me.signature_path);
  $('view').innerHTML = `<div class="card"><h2>توقيعي</h2><p class="mut">يظهر تلقائياً على الاتفاقيات التي تعتمدها. ارفع صورة التوقيع على ورق أبيض وتُزال الخلفية تلقائياً.</p>
    <div style="background:#fff;border:1px dashed var(--line);border-radius:10px;height:110px;display:grid;place-items:center;margin-bottom:10px">${sig ? `<img src="${sig}" style="max-height:100px;max-width:90%">` : '<span class="mut">لا يوجد توقيع</span>'}</div>
    <form id="sigF"><input type="file" name="f" accept="image/*" required><button class="pri" style="margin-top:10px">رفع التوقيع</button></form></div>`;
  $('sigF').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target).get('f'); run(e.submitter, async () => {
    const blob = await cleanSig(f); const path = await upload(new File([blob], 'sig.png', {type:'image/png'}), `signatures/${me.id}`);
    const {error} = await sb.from('members').update({signature_path: path}).eq('id', me.id); if(error) throw error;
    me.signature_path = path; admins[me.id] = {...(admins[me.id]||{}), signature_path: path}; toast('تم حفظ التوقيع'); render(); }); };
}
function cleanSig(file){
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onerror = () => rej(new Error('صورة غير صالحة'));
    img.onload = () => { const sc = Math.min(1, 700/img.width), c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      const x = c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height); const d = x.getImageData(0,0,c.width,c.height), p = d.data;
      for(let i=0;i<p.length;i+=4){ const l=(p[i]+p[i+1]+p[i+2])/3; if(l>200) p[i+3]=0; else if(l>140) p[i+3]=Math.round(255*(200-l)/60); }
      x.putImageData(d,0,0); URL.revokeObjectURL(url); c.toBlob(res, 'image/png'); };
    img.src = url; });
}
}
